app_name     = ytcui
binary       = ytcui
display_name = ytcui
github       = MilkmanAbi/ytcui

# next_best_version = yes  # if exact dep version missing, try nearest available
# next_best_version = no   # (default) fail fast with clear message

[build]
system = make
out    = ytcui

[deps]
ncurses
openssl >= 1.0
zlib

[deps.optional]
# ytcui-dl v2 no longer links against libcurl (it does its own TLS/socket
# I/O) — curl is only ever shelled out to as a CLI (startup update-check,
# thumbnail fetching), both of which degrade gracefully if it's missing, so
# it moved here from a hard build dependency.
curl.cmd = curl
chafa
mpv.cmd = mpv
ffmpeg.cmd = ffmpeg

[owns]
config = $XDG_CONFIG_HOME/ytcui
data   = $XDG_DATA_HOME/ytcui
cache  = $XDG_CACHE_HOME/ytcui

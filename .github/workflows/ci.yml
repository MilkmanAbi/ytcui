name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # ── Linux: GCC matrix ────────────────────────────────────────────────────────
  linux-gcc:
    name: Linux gcc-${{ matrix.gcc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gcc: [12, 13, 14]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-${{ matrix.gcc }} g++-${{ matrix.gcc }} \
            cmake ninja-build \
            libssl-dev zlib1g-dev libncursesw5-dev libcurl4-openssl-dev
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-${{ matrix.gcc }} \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: |
          ./build/ytcui --version
          ./build/ytcui --colors
          ./build/ytcui-we --version
          ./build/ytcui-we --check-runtime
      - name: Unit tests
        run: YTCUI_WE_BINARY="$PWD/build/ytcui-we" ctest --test-dir build --output-on-failure

  # ── Linux: Clang matrix ──────────────────────────────────────────────────────
  linux-clang:
    name: Linux clang-${{ matrix.clang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clang: [16, 17, 18]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-${{ matrix.clang }} \
            cmake ninja-build \
            libssl-dev zlib1g-dev libncursesw5-dev libcurl4-openssl-dev
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++-${{ matrix.clang }} \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: |
          ./build/ytcui --version
          ./build/ytcui --colors
          ./build/ytcui-we --version
          ./build/ytcui-we --check-runtime
      - name: Unit tests
        run: YTCUI_WE_BINARY="$PWD/build/ytcui-we" ctest --test-dir build --output-on-failure

  # ── macOS matrix ─────────────────────────────────────────────────────────────
  macos:
    name: macOS ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deps
        run: brew install cmake ninja openssl zlib ncurses curl
      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl) \
            -DZLIB_ROOT=$(brew --prefix zlib) \
            -DCURSES_INCLUDE_PATH=$(brew --prefix ncurses)/include \
            -DCURSES_LIBRARY=$(brew --prefix ncurses)/lib/libncursesw.dylib \
            -DCURL_ROOT=$(brew --prefix curl)
      - name: Build
        run: cmake --build build
      - name: Smoke test
        run: |
          ./build/ytcui --version
          ./build/ytcui --colors
          ./build/ytcui-we --version
          ./build/ytcui-we --check-runtime
      - name: Unit tests
        run: YTCUI_WE_BINARY="$PWD/build/ytcui-we" ctest --test-dir build --output-on-failure

  # ── FreeBSD ───────────────────────────────────────────────────────────────────
  freebsd:
    name: FreeBSD 14
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # FreeBSD ports installs to /usr/local — cmake needs explicit hints
          prepare: pkg install -y cmake ninja openssl ncurses curl
          run: |
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCURSES_INCLUDE_PATH=/usr/local/include \
              -DCURSES_LIBRARY=/usr/local/lib/libncursesw.so
            cmake --build build
            ./build/ytcui --version
            ./build/ytcui --colors
            ./build/ytcui-we --version
            YTCUI_WE_BINARY="$PWD/build/ytcui-we" ctest --test-dir build --output-on-failure

  # ── NetBSD ────────────────────────────────────────────────────────────────────
  netbsd:
    name: NetBSD 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          # vmactions NetBSD VM has PKG_PATH pre-configured for the running release;
          # do not override it. pkg_add handles package install directly.
          prepare: pkg_add cmake ninja-build curl
          run: |
            export PATH=/usr/pkg/bin:$PATH
            # NetBSD base system ships OpenSSL and curses at /usr; pkgsrc at /usr/pkg
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DOPENSSL_ROOT_DIR=/usr \
              -DCURSES_INCLUDE_PATH=/usr/include \
              -DCURSES_LIBRARY=/usr/lib/libcurses.so
            cmake --build build
            ./build/ytcui --version
            ./build/ytcui --colors
            ./build/ytcui-we --version
            YTCUI_WE_BINARY="$PWD/build/ytcui-we" ctest --test-dir build --output-on-failure

  # ── OpenBSD ───────────────────────────────────────────────────────────────────
  openbsd:
    name: OpenBSD 7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          prepare: pkg_add cmake ninja openssl%3 curl
          run: |
            # OpenBSD base has ncurses but no unversioned .so symlink; pass include hint only
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCURSES_INCLUDE_PATH=/usr/include
            cmake --build build
            ./build/ytcui --version
            ./build/ytcui --colors
            ./build/ytcui-we --version
            YTCUI_WE_BINARY="$PWD/build/ytcui-we" ctest --test-dir build --output-on-failure

  sanitizer:
    name: Linux AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build libssl-dev zlib1g-dev libncursesw5-dev libcurl4-openssl-dev
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DYTCUI_SANITIZE=ON
      - run: cmake --build build --parallel 2 --target test_app_lifetime test_runtime
      - run: ctest --test-dir build --output-on-failure -R '^(test_app_lifetime|test_runtime)$'
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
